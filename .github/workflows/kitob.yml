name: Kitob Mutoa Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * *'

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest

    steps:
      - name: Repository ni yuklash
        uses: actions/checkout@v4

      - name: Python ni sozlash
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kutubxonalarni o'rnatish
        run: pip install requests pymupdf

      - name: Kitob botini ishga tushirish
        env:
          KITOB_BOT_TOKEN: ${{ secrets.KITOB_BOT_TOKEN }}
          KITOB_CHAT_ID: ${{ secrets.KITOB_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python main.py
      
      - name: Sahifalar hisoblagichini saqlash
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f progress.json ]; then
            git add progress.json
            git diff --cached --quiet || git commit -m "Update book progress"
            git push
          else
            echo "progress.json hali yaratilmagan"
          fi
          
          
